<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        http-equiv="Content-Security-Policy"
        content="default-src 'self';
                 script-src 'self' 'unsafe-inline';
                 style-src 'self' 'unsafe-inline';"
    >

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Z Browser History</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;

            width: 100%;
            height: 100%;

            font-family:
                "Courier New",
                monospace;

            background: #111;
            color: #ddd;
        }

        .header {
            height: 70px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 24px;

            background: #1b1b1b;

            border-bottom:
                2px solid #555;
        }

        .title {
            font-size: 22px;
            font-weight: bold;
        }

        .controls {
            display: flex;
            gap: 8px;
        }

        button {
            padding: 8px 14px;

            border: 1px solid #666;
            border-radius: 3px;

            background: #2b2b2b;
            color: #ddd;

            font-family:
                "Courier New",
                monospace;

            cursor: pointer;
        }

        button:hover {
            background: #3b3b3b;
        }

        .content {
            padding: 20px;
        }

        .history-entry {
            padding: 14px 16px;

            margin-bottom: 8px;

            border: 1px solid #333;

            background: #181818;

            cursor: pointer;
        }

        .history-entry:hover {
            background: #242424;
            border-color: #666;
        }

        .history-title {
            font-size: 16px;
            font-weight: bold;

            margin-bottom: 6px;
        }

        .history-url {
            color: #999;

            font-size: 13px;

            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .history-time {
            margin-top: 6px;

            color: #666;

            font-size: 12px;
        }

        .empty {
            padding: 40px;

            text-align: center;

            color: #666;
        }
    </style>
</head>


<body>

    <div class="header">

        <div class="title">
            Z:// HISTORY
        </div>

        <div class="controls">

            <button
                id="clearButton"
            >
                CLEAR
            </button>

            <button
                id="closeButton"
            >
                CLOSE
            </button>

        </div>

    </div>


    <div
        class="content"
        id="historyList"
    ></div>


    <script>

        const historyList =
            document.getElementById(
                "historyList"
            );

        const clearButton =
            document.getElementById(
                "clearButton"
            );

        const closeButton =
            document.getElementById(
                "closeButton"
            );


        function formatTime(
            timestamp
        ) {

            return new Date(
                timestamp
            ).toLocaleString();
        }


        function renderHistory(
            entries
        ) {

            historyList.innerHTML = "";


            if (
                entries.length === 0
            ) {

                const empty =
                    document.createElement(
                        "div"
                    );

                empty.className =
                    "empty";

                empty.textContent =
                    "No browsing history.";

                historyList.appendChild(
                    empty
                );

                return;
            }


            const reversed =
                [...entries].reverse();


            for (
                const entry
                of reversed
            ) {

                const element =
                    document.createElement(
                        "div"
                    );

                element.className =
                    "history-entry";


                const title =
                    document.createElement(
                        "div"
                    );

                title.className =
                    "history-title";

                title.textContent =
                    entry.title ||
                    entry.url;


                const url =
                    document.createElement(
                        "div"
                    );

                url.className =
                    "history-url";

                url.textContent =
                    entry.url;


                const time =
                    document.createElement(
                        "div"
                    );

                time.className =
                    "history-time";

                time.textContent =
                    formatTime(
                        entry.timestamp
                    );


                element.appendChild(
                    title
                );

                element.appendChild(
                    url
                );

                element.appendChild(
                    time
                );


                element.addEventListener(
                    "click",
                    () => {

                        window.browserAPI
                            .navigate(
                                entry.url
                            );
                    }
                );


                historyList.appendChild(
                    element
                );
            }
        }


        async function loadHistory() {

            try {

                const entries =
                    await window.browserAPI
                        .getHistory();

                renderHistory(
                    entries
                );

            } catch (error) {

                console.error(
                    "History loading failed:",
                    error
                );
            }
        }


        clearButton.addEventListener(
            "click",
            async () => {

                window.browserAPI
                    .clearHistory();

                await loadHistory();
            }
        );


        closeButton.addEventListener(
            "click",
            () => {

                window.browserAPI
                    .closeHistory();
            }
        );


        loadHistory();

    </script>

</body>

</html>
